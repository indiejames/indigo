name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      # sdk/ is a separate Go module; ./... above stops at its boundary.
      - name: Run SDK tests
        working-directory: sdk
        run: go test ./...

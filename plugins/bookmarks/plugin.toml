name        = "bookmarks"
version     = "0.3.0"
sdk_version = "0.2.0"
description = "Bookmark lines and jump back to them, under space b in the Command menu."

[[menu_item]]
label = "Bookmarks"
key   = "b"
  [[menu_item.children]]
  label   = "Toggle bookmark"
  command = "bookmarks.toggle"
  key     = "b"
  [[menu_item.children]]
  label   = "List bookmarks"
  command = "bookmarks.open"
  key     = "l"

[binaries]
"darwin/arm64" = "bookmarks-darwin-arm64"
"darwin/amd64" = "bookmarks-darwin-amd64"
"linux/amd64"  = "bookmarks-linux-amd64"
"linux/arm64"  = "bookmarks-linux-arm64"

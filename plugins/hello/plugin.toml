name        = "hello"
version     = "0.2.0"
sdk_version = "0.2.0"
description = "Sample plugin that prints 'hello' in the status bar"

[[menu_item]]
label   = "Hello"
command = "hello.say"
key     = "h"

[binaries]
"darwin/arm64" = "hello-darwin-arm64"
"darwin/amd64" = "hello-darwin-amd64"
"linux/amd64"  = "hello-linux-amd64"
"linux/arm64"  = "hello-linux-arm64"

name        = "indigo-git"
version     = "0.2.0"
sdk_version = "0.1.0"
description = "Git integration: branch/diff status, inline blame (alt+b), hunk nav (alt+n/alt+p), diff view."

[[menu_item]]
label = "Git"
key   = "g"

  [[menu_item.children]]
  label   = "Toggle blame"
  command = "git.blame"
  key     = "b"

  [[menu_item.children]]
  label   = "Blame details"
  command = "git.blame_details"
  key     = "i"

  [[menu_item.children]]
  label   = "Diff"
  command = "git.diff"
  key     = "d"

[binaries]
"darwin/arm64" = "indigo-git-darwin-arm64"
"darwin/amd64" = "indigo-git-darwin-amd64"
"linux/amd64"  = "indigo-git-linux-amd64"
"linux/arm64"  = "indigo-git-linux-arm64"

name        = "indigo-git"
version     = "0.3.0"
sdk_version = "0.2.0"
description = "Git integration: branch/diff status, inline blame, hunk navigation and a diff view, all under space g."

[[menu_item]]
label = "Git"
key   = "g"

  [[menu_item.children]]
  label   = "Toggle blame"
  command = "git.blame"
  key     = "b"

  [[menu_item.children]]
  label   = "Blame details"
  command = "git.blame_details"
  key     = "i"

  [[menu_item.children]]
  label   = "Diff"
  command = "git.diff"
  key     = "d"
  [[menu_item.children]]
  label   = "Next hunk"
  command = "git.next_hunk"
  key     = "n"
  [[menu_item.children]]
  label   = "Previous hunk"
  command = "git.prev_hunk"
  key     = "p"

[binaries]
"darwin/arm64" = "indigo-git-darwin-arm64"
"darwin/amd64" = "indigo-git-darwin-amd64"
"linux/amd64"  = "indigo-git-linux-amd64"
"linux/arm64"  = "indigo-git-linux-arm64"
